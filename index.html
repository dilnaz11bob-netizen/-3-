<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imdiva — Онлайн магазин | Алматы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-white: #ffffff;
            --text-dark: #0f172a; /* Глубокий темно-синий, почти черный */
            --brand-blue: #0b192c; /* Насыщенный темно-синий */
            --text-muted: #475569;
            --accent-red: #c51d2f; /* Классический красный */
            --line-light: #e2e8f0; /* Чистые белые и аккуратные линии */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            background-color: var(--bg-white);
            color: var(--text-dark);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        #welcomeScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            background-color: var(--bg-white);
        }

        .welcome-container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.7s ease-out;
        }

        .logo-wrapper {
            width: 100%;
            max-width: 290px;
            margin-bottom: 8px;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .divider {
            width: 75%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--line-light), transparent);
            margin: 6px 0 20px;
        }

        .info-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin-bottom: 32px;
        }

        .city {
            font-size: 17px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .shop-title {
            font-size: 34px;
            font-weight: 600;
            color: var(--brand-blue);
            line-height: 1.1;
            margin: 4px 0 8px;
            letter-spacing: 0.5px;
        }

        .phone-link {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 0.5px;
            padding: 2px 8px;
            transition: color 0.2s ease;
        }

        .phone-link:hover {
            color: var(--accent-red);
        }

        .insta-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 2px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 17px;
            font-weight: 400;
            padding: 2px 10px;
            transition: opacity 0.2s ease;
        }

        .insta-link:hover {
            opacity: 0.7;
        }

        .insta-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .catalog-btn {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 250px;
            padding: 10px 20px 12px;
            background-color: var(--bg-white);
            color: var(--text-dark);
            border: 1px solid var(--brand-blue);
            border-radius: 10px;
            text-decoration: none;
            box-shadow: 0 2px 10px rgba(11, 25, 44, 0.06);
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .catalog-btn:hover {
            border-color: var(--accent-red);
            background-color: #f8fafc;
            transform: translateY(-2px);
        }

        .btn-top-text {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 1px;
        }

        .btn-main-text {
            font-size: 20px;
            font-weight: 500;
            line-height: 1.15;
            letter-spacing: 0.2px;
            color: var(--brand-blue);
        }

        #catalogScreen {
            display: none;
            padding-bottom: 90px;
            background-color: var(--bg-white);
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 18px 16px 32px;
        }

        .header-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 14px;
            position: relative;
        }

        .back-home {
            text-decoration: none;
            color: var(--text-muted);
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--line-light);
            background: var(--bg-white);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-home:hover {
            border-color: var(--brand-blue);
            color: var(--brand-blue);
        }

        .header-logo {
            max-width: 150px;
            width: 45%;
            height: auto;
            display: block;
            object-fit: contain;
            margin: 0 auto;
        }

        .categories-nav {
            position: sticky;
            top: 0;
            z-index: 20;
            background-color: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(6px);
            padding: 10px 0 14px;
            margin: 0 -16px 16px;
            padding-left: 16px;
            padding-right: 16px;
            border-bottom: 1px solid var(--line-light);
        }

        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-bottom: 2px;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            flex: 0 0 auto;
            background-color: var(--bg-white);
            color: var(--text-dark);
            border: 1px solid var(--line-light);
            border-radius: 8px;
            padding: 7px 14px;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.2;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.22s ease;
            text-align: center;
        }

        .cat-btn span.sub-ru {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 400;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .cat-btn.active {
            background-color: var(--brand-blue);
            border: 1px solid var(--brand-blue);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(11, 25, 44, 0.15);
        }

        .cat-btn.active span.sub-ru {
            color: #cbd5e1;
        }

        .section-heading {
            margin-bottom: 14px;
            text-align: center;
        }

        .section-heading h2 {
            font-size: 22px;
            font-weight: 500;
            color: var(--brand-blue);
            line-height: 1.2;
        }

        .section-heading p {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .category-header-video-box {
            width: 100%;
            max-width: 210px;
            aspect-ratio: 9 / 13;
            margin: 0 auto 18px;
            background-color: var(--brand-blue);
            border: 1px solid var(--line-light);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(11, 25, 44, 0.08);
            position: relative;
            cursor: pointer;
        }

        .category-header-video-box iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: none;
        }

        .brand-story-card {
            background-color: var(--bg-white);
            border: 1px solid var(--line-light);
            border-radius: 12px;
            padding: 20px 18px;
            text-align: center;
        }

        .brand-story-card h3 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--brand-blue);
        }

        .brand-story-card p {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .info-highlights {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .highlight-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 10px 8px;
            border: 1px solid var(--line-light);
        }

        .highlight-item strong {
            display: block;
            font-size: 16px;
            color: var(--brand-blue);
            margin-bottom: 2px;
        }

        .highlight-item span {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            color: var(--text-muted);
        }

        .quick-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .white-action-btn {
            flex: 1;
            background-color: var(--bg-white);
            color: var(--brand-blue);
            border: 1px solid var(--brand-blue);
            border-radius: 8px;
            padding: 10px 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 500;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s ease;
        }

        .white-action-btn:hover {
            background-color: var(--brand-blue);
            color: #ffffff;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            animation: fadeIn 0.4s ease;
        }

        .product-card {
            background-color: var(--bg-white);
            border: 1px solid var(--line-light);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-card.out-of-stock {
            opacity: 0.45;
            filter: grayscale(35%);
        }

        .product-image-wrap {
            width: 100%;
            aspect-ratio: 3 / 4;
            background-color: #f1f5f9;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .product-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .product-image-wrap:hover img {
            transform: scale(1.03);
        }

        .sold-out-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.95);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            padding: 6px 10px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            z-index: 5;
        }

        .product-info {
            padding: 10px 10px 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
            text-align: center;
        }

        .product-name {
            font-size: 18px;
            font-weight: 500;
            color: var(--brand-blue);
            margin-bottom: 2px;
        }

        .product-price {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent-red);
            margin-bottom: 6px;
        }

        .card-cart-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid var(--line-light);
            border-radius: 6px;
            padding: 3px 6px;
        }

        .card-qty-btn {
            background: var(--bg-white);
            border: 1px solid var(--line-light);
            width: 24px;
            height: 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            color: var(--brand-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-qty-btn:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .card-qty-count {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .add-to-cart-simple {
            width: 100%;
            background-color: var(--bg-white);
            color: var(--brand-blue);
            border: 1px solid var(--brand-blue);
            border-radius: 6px;
            padding: 6px;
            font-family: 'Cormorant Garamond', Georgia, serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .add-to-cart-simple:hover {
            background-color: var(--brand-blue);
            color: #ffffff;
        }

        .btn-main {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.1;
        }

        .btn-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .add-to-cart-simple:hover .btn-sub {
            color: #cbd5e1;
        }

        .bottom-cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-white);
            border-top: 1px solid var(--line-light);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 90;
            box-shadow: 0 -4px 16px rgba(11, 25, 44, 0.06);
            max-width: 600px;
            margin: 0 auto;
        }

        .bottom-cart-info {
            display: flex;
            flex-direction: column;
        }

        .bottom-cart-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            color: var(--text-muted);
        }

        .bottom-cart-total {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-red);
        }

        .bottom-cart-btn {
            background-color: var(--accent-red);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 9px 16px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(197, 29, 47, 0.2);
            transition: opacity 0.2s ease;
        }

        .bottom-cart-btn:hover {
            opacity: 0.9;
        }

        .image-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 25, 44, 0.85);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .image-modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .image-modal-content {
            position: relative;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .image-modal-content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .image-modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .close-img-modal {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 32px;
            cursor: pointer;
            z-index: 210;
        }

        .cart-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 25, 44, 0.4);
            backdrop-filter: blur(3px);
            z-index: 150;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .cart-modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-modal {
            background: var(--bg-white);
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            padding: 20px 18px 24px;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cart-modal-overlay.open .cart-modal {
            transform: translateY(0);
        }

        .cart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--line-light);
            padding-bottom: 10px;
        }

        .cart-header h3 {
            font-size: 22px;
            color: var(--brand-blue);
            font-weight: 500;
        }

        .close-cart-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-items-list {
            overflow-y: auto;
            max-height: 45vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
            padding-right: 4px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid var(--line-light);
        }

        .cart-item-img {
            width: 50px;
            height: 65px;
            object-fit: cover;
            border-radius: 6px;
            background: #eee;
            cursor: pointer;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--brand-blue);
        }

        .cart-item-price {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            color: var(--accent-red);
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .qty-btn {
            background: var(--bg-white);
            border: 1px solid var(--line-light);
            width: 22px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: var(--brand-blue);
            font-size: 12px;
        }

        .remove-item-btn {
            background: none;
            border: none;
            color: var(--accent-red);
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            cursor: pointer;
            margin-left: auto;
        }

        .cart-footer {
            border-top: 1px solid var(--line-light);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 500;
            color: var(--brand-blue);
        }

        .whatsapp-checkout-btn {
            background-color: #25d366;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.25);
        }

        .empty-cart-msg, .empty-category {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1 -->
    <main id="welcomeScreen">
        <div class="welcome-container">
            <div class="logo-wrapper">
                <img src="37918-removebg-preview.png" alt="Imdiva">
            </div>
            <div class="divider"></div>
            <div class="info-block">
                <span class="city">Алматы</span>
                <h1 class="shop-title">Онлайн магазин</h1>
                <a href="tel:+77077787661" class="phone-link">8 707 778 76 61</a>
                <a href="https://www.instagram.com/d_iva_brand" target="_blank" rel="noopener noreferrer" class="insta-link">
                    <img src="Untitled6_20261121143625.png" alt="Instagram" class="insta-icon">
                    <span>d_iva_brand</span>
                </a>
            </div>
            <button class="catalog-btn" id="goToCatalogBtn">
                <span class="btn-top-text">Каталог</span>
                <span class="btn-main-text">Тапсырыс беру</span>
            </button>
        </div>
    </main>

    <!-- ЭКРАН 2: КАТАЛОГ -->
    <div id="catalogScreen">
        <div class="container">
            <header class="header-banner">
                <button class="back-home" id="goBackHomeBtn">← Басты бет</button>
                <img src="37918-removebg-preview.png" alt="Imdiva" class="header-logo">
                <div style="width: 70px;"></div>
            </header>

            <nav class="categories-nav" aria-label="Категории">
                <div class="categories-scroll" id="categoryTabs">
                    <button class="cat-btn active" data-cat="general">
                        Жалпы ақпарат
                        <span class="sub-ru">Общая информация</span>
                    </button>
                    <button class="cat-btn" data-cat="short_scarves">
                        Қысқа шарфтар
                        <span class="sub-ru">Авторские короткие шарфики</span>
                    </button>
                    <button class="cat-btn" data-cat="long_scarves">
                        Ұзын шарфтар
                        <span class="sub-ru">Авторские длинные шарфы</span>
                    </button>
                    <button class="cat-btn" data-cat="pearl_magnet">
                        Інжу магнитпен шарфтар

            if (!cart[name]) {

            } else {
                cart[name].quantity += delta;
                if (cart[name].quantity <= 0) delete cart[name];
            }
            updateGlobalCartUI();
            const activeBtn = document.querySelector(".cat-btn.active");
            if (activeBtn) switchCategory(activeBtn.dataset.cat, false);
        }

        function updateGlobalCartUI() {
            let totalCount = 0, totalSum = 0;
            for (let key in cart) {
                totalCount += cart[key].quantity;
                totalSum += cart[key].price * cart[key].quantity;
            }
            if (totalCount > 0) {
                bottomCartBar.style.display = "flex";
                cartCountBadge.textContent = totalCount;

            }
            renderCartModalItems();
        }

        function renderCartModalItems() {
            const keys = Object.keys(cart);
            if (keys.length === 0) {
                cartItemsList.innerHTML = `<div class="empty-cart-msg">Себет бос / Корзина пуста</div>`;
                cartTotalPrice.textContent = "0 тг";
                return;
            }
            let totalSum = 0;
            cartItemsList.innerHTML = keys.map(name => {
                const item = cart[name];
                const itemSum = item.price * item.quantity;
                totalSum += itemSum;
                const imgUrl = `https://lh3.googleusercontent.com/d/${item.id}=w400`;
                return `
                    <div class="cart-item">
                        <img src="${imgUrl}" alt="${item.name}" class="cart-item-img" onclick="openZoom('${imgUrl}')">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">${item.price.toLocaleString()} тг</div>
                            <div class="cart-item-controls">
                                <button class="qty-btn" onclick="changeItemQty('${item.name}', -1)">-</button>
                                <span>${item.quantity}</span>
                                <button class="qty-btn" onclick="changeItemQty('${item.name}', 1)">+</button>
                                <button class="remove-item-btn" onclick="deleteCartItem('${item.name}')">Жою</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
            cartTotalPrice.textContent = totalSum.toLocaleString() + " тг";
        }

        window.deleteCartItem = function(name) {
            delete cart[name];
            updateGlobalCartUI();
            const activeBtn = document.querySelector(".cat-btn.active");
            if (activeBtn) switchCategory(activeBtn.dataset.cat, false);
        };

        openCartModalBtn.addEventListener("click", () => cartModal.classList.add("open"));
        closeCartBtn.addEventListener("click", () => cartModal.classList.remove("open"));
        cartModal.addEventListener("click", (e) => {
            if (e.target === cartModal) cartModal.classList.remove("open");
        });

        whatsappCheckoutBtn.addEventListener("click", () => {
            const keys = Object.keys(cart);
            if (keys.length === 0) return;
            let text = "Здравствуйте! Хочу сделать заказ из магазина Imdiva:\n\n";
            let total = 0;
            keys.forEach((name, index) => {
                const item = cart[name];
                const sum = item.price * item.quantity;
                total += sum;
                text += `${index + 1}. *${item.name}* — ${item.quantity} шт. (${item.price.toLocaleString()} тг) = ${sum.toLocaleString()} тг\n`;
            });
            text += `\n*Барлығы / Итого: ${total.toLocaleString()} тг*`;
            window.open(`https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(text)}`, "_blank");
        });

        function renderProducts(items, catKey) {
            const fileId = categoryVideoIds[catKey];
            let videoBoxHtml = "";
            
            if (fileId) {
                videoBoxHtml = `
                    <div class="category-header-video-box" onclick="openVideoFullscreen('${catKey}')" title="Нажмите, чтобы открыть на весь экран">
                        <iframe src="https://drive.google.com/file/d/${fileId}/preview?autoplay=1" allow="autoplay"></iframe>
                    </div>
                `;
            }

            if (!items || items.length === 0) {
                contentEl.innerHTML = `
                    ${videoBoxHtml}
                    <div class="empty-category" style="margin-top:20px;">
                        <h3>Топтама дайындалуда / Раздел наполняется</h3>
                        <p>Скоро здесь появятся товары. Для заказа пишите нам в WhatsApp.</p>
                    </div>
                `;
                return;
            }

            const cardsHtml = items.map(item => {
                const imgUrl = `https://lh3.googleusercontent.com/d/${item.id}=w800`;
                const cartItem = cart[item.name];
                const qty = cartItem ? cartItem.quantity : 0;

                if (!item.inStock) {
                    return `
                        <article class="product-card out-of-stock">
                            <div class="product-image-wrap" onclick="openZoom('${imgUrl}')">
                                <span class="sold-out-badge">Нет в наличии</span>
                                <img src="${imgUrl}" alt="${item.name}" loading="lazy">
                            </div>
                            <div class="product-info">
                                <div>
                                    <h3 class="product-name">${item.name}</h3>
                                    <div class="product-price">${item.price.toLocaleString()} тг</div>
                                </div>
                                <span class="add-to-cart-simple disabled">
                                    <span class="btn-main">Сатылымда жоқ</span>
                                    <span class="btn-sub">Нет в наличии</span>
                                </span>
                            </div>
                        </article>
                    `;
                }

                let actionBlock = qty > 0 ? `
                    <div class="card-cart-controls">
                        <button class="card-qty-btn" onclick="changeItemQty('${item.name}', -1)">-</button>
                        <span class="card-qty-count">${qty} шт.</span>
                        <button class="card-qty-btn" onclick="changeItemQty('${item.name}', 1)">+</button>
                    </div>
                ` : `
                    <button class="add-to-cart-simple" onclick='changeItemQty("${item.name}", 1, ${JSON.stringify(item)})'>
                        <span class="btn-main">Себетке қосу</span>
                        <span class="btn-sub">Добавить в корзину</span>
                    </button>
                `;

                return `
                    <article class="product-card">
                        <div class="product-image-wrap" onclick="openZoom('${imgUrl}')">
                            <img src="${imgUrl}" alt="${item.name}" loading="lazy">
                        </div>
                        <div class="product-info">
                            <div>
                                <h3 class="product-name">${item.name}</h3>
                                <div class="product-price">${item.price.toLocaleString()} тг</div>
                            </div>
                            ${actionBlock}
                        </div>
                    </article>
                `;
            }).join("");

            contentEl.innerHTML = `
                ${videoBoxHtml}
                <section class="products-grid">${cardsHtml}</section>
            `;
        }

        function switchCategory(catKey, scrollToTop = true) {
            const titleObj = categoryTitles[catKey];
            headingEl.innerHTML = `
                <h2>${titleObj.kz}</h2>
                <p>${titleObj.ru}</p>
            `;

            if (catKey === "general") {
                contentEl.innerHTML = `
                    <div class="brand-story-card">
                        <h3>Imdiva — сшито с любовью</h3>
                        <p>Авторские аксессуары и изделия в современном национальном стиле. Ручная работа и премиальное качество.</p>
                        <div class="info-highlights">
                            <div class="highlight-item">
                                <strong>Алматы</strong>
                                <span>Доставка по Казахстану</span>
                            </div>
                            <div class="highlight-item">
                                <strong>100% Ручная работа</strong>
                                <span>Эксклюзивные детали</span>
                            </div>
                        </div>
                        <div class="quick-actions">
                            <a href="https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent('Здравствуйте!')}" target="_blank" class="white-action-btn">WhatsApp</a>
                            <a href="https://www.instagram.com/d_iva_brand" target="_blank" class="white-action-btn">Instagram</a>
                        </div>
                    </div>
                `;
            } else {
                const items = catalogData[catKey] || [];
                renderProducts(items, catKey);
            }

            if (scrollToTop) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        document.querySelectorAll(".cat-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                btn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
                switchCategory(btn.dataset.cat);
            });
        });

        switchCategory("general", false);
    </script>
</body>
</html>
