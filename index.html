<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imdiva — Эксклюзивные шарфы и платки | Алматы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #fcfbf9;
            --bg-card: #ffffff;
            --text-main: #1e232a;
            --brand-primary: #0b192c;
            --brand-hover: #162e4d;
            --text-muted: #64748b;
            --accent-color: #b91c1c;
            --border-color: #e5e7eb;
            --shadow-subtle: 0 10px 30px -5px rgba(11, 25, 44, 0.06);
            --shadow-hover: 0 20px 40px -10px rgba(11, 25, 44, 0.12);
            --radius-soft: 20px;
            --radius-btn: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            font-size: 17px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= ЭКРАН 1: ГЛАВНАЯ ================= */
        #welcomeScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: #ffffff;
        }

        .welcome-container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            padding: 20px 16px;
        }

        .logo-wrapper {
            width: 100%;
            max-width: 280px;
            margin-bottom: 12px;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .welcome-city {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .shop-title {
            font-size: 30px;
            font-weight: 700;
            color: var(--brand-primary);
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .phone-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .insta-link-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 17px;
            font-weight: 600;
            color: var(--brand-primary);
            margin-bottom: 32px;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 12px;
            border: 1.5px solid transparent;
            transition: all 0.2s ease;
        }

        .insta-link-box:hover {
            border-color: var(--brand-primary);
            background-color: #fafaf9;
        }

        .insta-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
            border-radius: 4px;
        }

        .catalog-btn {
            width: 100%;
            max-width: 320px;
            padding: 16px 20px;
            background-color: var(--brand-primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-btn);
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(11, 25, 44, 0.25);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .catalog-btn:hover {
            background-color: var(--brand-hover);
            transform: translateY(-2px);
        }

        .btn-ru-main {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
            color: #ffffff;
        }

        .btn-kz-sub {
            font-size: 17px;
            font-weight: 500;
            color: #e2e8f0;
            margin-top: 3px;
            line-height: 1.2;
        }

        /* ================= ЭКРАН 2: КАТАЛОГ ================= */
        #catalogScreen {
            display: none;
            padding-bottom: 150px;
            background-color: var(--bg-main);
        }

        .container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .header-banner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 16px 20px 24px;
            background: var(--bg-card);
            border-radius: var(--radius-soft);
            box-shadow: var(--shadow-subtle);
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .back-home {
            width: 100%;
            text-decoration: none;
            color: var(--brand-primary);
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: var(--radius-btn);
            border: 1.5px solid var(--border-color);
            background: #fafaf9;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-home:hover {
            background: #ffffff;
            border-color: var(--brand-primary);
        }

        .header-logo {
            max-width: 140px;
            height: auto;
            display: block;
        }

        /* ДИНАМИЧЕСКАЯ ЛИПКАЯ ПАНЕЛЬ КАТЕГОРИЙ */
        .categories-section {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: rgba(252, 251, 249, 0.97);
            backdrop-filter: blur(8px);
            padding: 14px 0;
            margin: 0 -16px 20px;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .categories-section.scrolled {
            padding: 6px 0;
            background-color: rgba(255, 255, 255, 0.99);
            box-shadow: 0 4px 20px rgba(11, 25, 44, 0.08);
        }

        .categories-wrapper-inner {
            max-width: 760px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .categories-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-align: left;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.25s ease;
        }

        .categories-section.scrolled .categories-label {
            opacity: 0;
            height: 0;
            margin: 0;
            overflow: hidden;
        }

        .categories-scroll {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--brand-primary) var(--border-color);
            padding-bottom: 4px;
        }

        .categories-scroll::-webkit-scrollbar {
            height: 3px;
        }

        .categories-scroll::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 4px;
        }

        .cat-btn {
            flex: 0 0 auto;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 16px;
            font-family: inherit;
            cursor: pointer;
            text-align: center;
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 190px;
            white-space: normal;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .categories-section.scrolled .cat-btn {
            padding: 5px 10px;
            border-radius: 8px;
        }

        .cat-btn .cat-main {
            font-size: 16px;
            font-weight: 700;
            color: var(--brand-primary);
            line-height: 1.2;
            transition: font-size 0.25s ease;
        }

        .categories-section.scrolled .cat-btn .cat-main {
            font-size: 12px;
        }

        .cat-btn .cat-sub {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 1px;
            line-height: 1.1;
            transition: all 0.25s ease;
        }

        .categories-section.scrolled .cat-btn .cat-sub {
            font-size: 9px;
            opacity: 0.8;
        }

        .cat-btn:hover {
            border-color: var(--brand-primary);
        }

        .cat-btn.active {
            background-color: var(--brand-primary);
            border-color: var(--brand-primary);
            box-shadow: 0 4px 12px rgba(11, 25, 44, 0.2);
        }

        .cat-btn.active .cat-main,
        .cat-btn.active .cat-sub {
            color: #ffffff;
        }

        /* Заголовок активного раздела */
        .section-heading {
            margin-bottom: 24px;
            text-align: center;
            padding: 24px 20px;
            background-color: var(--bg-card);
            border-radius: var(--radius-soft);
            box-shadow: var(--shadow-subtle);
            border: 1px solid var(--border-color);
        }

        .section-heading h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--brand-primary);
            line-height: 1.3;
        }

        .section-heading p {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Карточка о бренде */
        .brand-story-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-soft);
            padding: 32px 24px;
            text-align: center;
            box-shadow: var(--shadow-subtle);
        }

        .brand-story-card h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 14px;
            color: var(--brand-primary);
        }

        .brand-story-card p {
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .info-highlights {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .highlight-item {
            background: #fafaf9;
            border-radius: 14px;
            padding: 16px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        .highlight-item strong {
            display: block;
            font-size: 16px;
            color: var(--brand-primary);
            margin-bottom: 2px;
        }

        .highlight-item span {
            font-size: 14px;
            color: var(--text-muted);
        }

        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .white-action-btn {
            background-color: var(--brand-primary);
            color: #ffffff;
            border-radius: var(--radius-btn);
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            display: block;
            box-shadow: var(--shadow-subtle);
            transition: background-color 0.2s;
        }

        .white-action-btn:hover {
            background-color: var(--brand-hover);
        }

        /* СЕТКА ТОВАРОВ */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        @media (max-width: 480px) {
            .products-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        .product-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-soft);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-subtle);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .product-card.out-of-stock {
            opacity: 0.65;
        }

        .product-image-wrap {
            width: 100%;
            aspect-ratio: 4 / 5;
            background-color: #f3f4f6;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .product-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .product-image-wrap:hover img {
            transform: scale(1.04);
        }

        .zoom-hint {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.92);
            color: var(--brand-primary);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(4px);
        }

        .sold-out-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.95);
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            z-index: 5;
            box-shadow: 0 10px 25px rgba(185, 28, 28, 0.15);
        }

        .product-info {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
            text-align: center;
            gap: 14px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--brand-primary);
            line-height: 1.4;
        }

        .product-price {
            font-size: 19px;
            font-weight: 700;
            color: var(--accent-color);
            margin-top: 4px;
        }

        /* БЛОК УПАКОВКИ В САМОМ НИЗУ */
        .packaging-divider {
            margin: 48px 0 20px;
            text-align: center;
            padding: 28px 20px;
            background: linear-gradient(135deg, var(--brand-primary) 0%, #162e4d 100%);
            border-radius: var(--radius-soft);
            color: #ffffff;
            box-shadow: var(--shadow-subtle);
        }

        .packaging-divider h3 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .packaging-divider p {
            font-size: 14px;
            color: #cbd5e1;
        }

        /* Кнопка прокрутки (динамическая стрелочка вниз/вверх) */
        .scroll-action-btn {
            position: fixed;
            bottom: 95px;
            right: 16px;
            width: 48px;
            height: 48px;
            background-color: var(--brand-primary);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            z-index: 85;
            box-shadow: 0 6px 20px rgba(11, 25, 44, 0.3);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .scroll-action-btn.visible {
            opacity: 1;
            visibility: visible;
        }

        .scroll-action-btn:hover {
            transform: scale(1.08);
            background-color: var(--brand-hover);
        }

        /* Интерактивные элементы */
        .add-to-cart-simple {
            width: 100%;
            background-color: var(--brand-primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: inherit;
            transition: background-color 0.2s;
        }

        .add-to-cart-simple:hover {
            background-color: var(--brand-hover);
        }

        .add-to-cart-simple.disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .add-to-cart-simple.included-badge {
            background-color: #f1f5f9;
            color: var(--brand-primary);
            border: 1px solid var(--border-color);
            cursor: default;
        }

        .btn-main {
            font-size: 15px;
            font-weight: 700;
        }

        .btn-sub {
            font-size: 12px;
            font-weight: 400;
            color: #cbd5e1;
            margin-top: 1px;
        }
        
        .add-to-cart-simple.included-badge .btn-sub {
            color: var(--text-muted);
        }

        .card-cart-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafaf9;
            border: 2px solid var(--brand-primary);
            border-radius: 12px;
            padding: 6px;
        }

        .card-qty-btn {
            background: var(--brand-primary);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 9px;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-qty-count {
            font-size: 16px;
            font-weight: 700;
            color: var(--brand-primary);
        }

        /* НИЖНЯЯ ПАНЕЛЬ КОРЗИНЫ */
        .bottom-cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 2px solid var(--brand-primary);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            z-index: 90;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.08);
            max-width: 760px;
            margin: 0 auto;
        }

        .bottom-cart-info {
            display: flex;
            flex-direction: column;
        }

        .bottom-cart-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .bottom-cart-total {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .bottom-cart-btn {
            background-color: var(--brand-primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-btn);
            padding: 14px 22px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            line-height: 1.2;
            box-shadow: 0 4px 15px rgba(11, 25, 44, 0.25);
            transition: transform 0.2s;
        }

        .bottom-cart-btn:hover {
            transform: scale(1.02);
            background-color: var(--brand-hover);
        }

        /* МОДАЛЬНЫЕ ОКНА */
        .image-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 25, 44, 0.9);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            backdrop-filter: blur(6px);
        }

        .image-modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .image-modal-content {
            position: relative;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 4 / 5;
            background: #000;
            border-radius: var(--radius-soft);
            overflow: hidden;
            box-shadow: var(--shadow-hover);
        }

        .image-modal-content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .close-img-modal-btn {
            margin-top: 20px;
            background: #ffffff;
            color: var(--brand-primary);
            border: none;
            border-radius: var(--radius-btn);
            padding: 14px 32px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .cart-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 25, 44, 0.6);
            z-index: 150;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            backdrop-filter: blur(4px);
        }

        .cart-modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-modal {
            background: var(--bg-card);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            padding: 28px 20px 32px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -15px 40px rgba(0,0,0,0.15);
        }

        .cart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            border-bottom: 1.5px solid var(--border-color);
            padding-bottom: 14px;
        }

        .cart-header h3 {
            font-size: 20px;
            color: var(--brand-primary);
            font-weight: 700;
        }

        .close-cart-btn {
            background: #fafaf9;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            color: var(--brand-primary);
        }

        .cart-items-list {
            overflow-y: auto;
            max-height: 46vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            padding-right: 4px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fafaf9;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .cart-item.free-gift {
            border: 2px dashed var(--brand-primary);
            background: #f4f6f9;
        }

        .gift-badge {
            position: absolute;
            top: -10px;
            right: 12px;
            background: var(--brand-primary);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .cart-item-img {
            width: 60px;
            height: 75px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--brand-primary);
        }

        .cart-item-price {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent-color);
            margin-top: 2px;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .qty-btn {
            background: var(--brand-primary);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            color: #ffffff;
            font-size: 16px;
        }

        .cart-qty-num {
            font-size: 15px;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }

        .remove-item-btn {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: var(--accent-color);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-left: auto;
        }

        .cart-footer {
            border-top: 1.5px solid var(--border-color);
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--brand-primary);
        }

        .whatsapp-checkout-btn {
            background-color: var(--brand-primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-btn);
            padding: 16px;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            line-height: 1.3;
            box-shadow: 0 4px 15px rgba(11, 25, 44, 0.3);
            transition: transform 0.2s;
        }

        .whatsapp-checkout-btn:hover {
            transform: scale(1.02);
            background-color: var(--brand-hover);
        }

        .empty-cart-msg, .empty-category {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-muted);
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНАЯ СТРАНИЦА -->
    <main id="welcomeScreen">
        <div class="welcome-container">
            <div class="logo-wrapper">
                <img src="37918-removebg-preview.png" alt="Imdiva">
            </div>
            
            <span class="welcome-city">Алматы</span>
            <h1 class="shop-title">Онлайн магазин</h1>
            
            <div class="phone-text">8 707 778 76 61</div>
            
            <!-- Ссылка на Instagram с вашим новым значком Untitled7_20261122204449.png -->
            <a href="https://www.instagram.com/d_iva_brand" target="_blank" rel="noopener noreferrer" class="insta-link-box">
                <img src="Untitled7_20261122204449.png" alt="Instagram" class="insta-icon">
                <span>D_iva_brand</span>
            </a>
            
            <!-- КНОПКА В ТЕМНО-ГОЛУБОМ ЦВЕТЕ НА ДВУХ ЯЗЫКАХ -->
            <button class="catalog-btn" id="goToCatalogBtn">
                <span class="btn-ru-main">Каталог</span>
                <span class="btn-kz-sub">Тапсырыс беру</span>
            </button>
        </div>
    </main>

    <!-- ЭКРАН 2: КАТАЛОГ -->
    <div id="catalogScreen">
        <div class="container">
            <header class="header-banner">
                <img src="37918-removebg-preview.png" alt="Imdiva" class="header-logo">
                <button class="back-home" id="goBackHomeBtn">
                    ← На главную страницу / Басты бетке
                </button>
            </header>

            <!-- ЛЕНТА КАТЕГОРИЙ -->
            <section class="categories-section" id="categoriesSection">
                <div class="categories-wrapper-inner">
                    <div class="categories-label">Выберите интересующий раздел:</div>
                    <div class="categories-scroll" id="categoryTabs">
                        <button class="cat-btn active" data-cat="general">
                            <span class="cat-main">Жалпы ақпарат</span>
                            <span class="cat-sub">Общая информация</span>
                        </button>
                    </div>
                </div>
            </section>

            <div class="section-heading" id="sectionHeading">
                <h2>Жалпы ақпарат / Общая информация</h2>
                <p>Imdiva — сшито с любовью • Алматы</p>
            </div>

            <!-- ОСНОВНОЙ КОНТЕНТ -->
            <main id="catalogContent">
                <div class="empty-category">Деректер жүктелуде / Загрузка...</div>
            </main>

            <!-- БЛОК УПАКОВОК В САМОМ НИЗУ -->
            <section id="bottomPackagingContainer"></section>
        </div>
    </div>

    <!-- ДИНАМИЧЕСКАЯ КНОПКА ПРОКРУТКИ -->
    <button class="scroll-action-btn" id="scrollActionBtn" title="Прокрутить">↓</button>

    <!-- НИЖНЯЯ ПАНЕЛЬ КОРЗИНЫ -->
    <div class="bottom-cart-bar" id="bottomCartBar" style="display: none;">
        <div class="bottom-cart-info">
            <span class="bottom-cart-title">Таңдалды / Выбрано: <span id="cartCountBadge">0</span></span>
            <span class="bottom-cart-total" id="bottomCartTotal">0 тг</span>
        </div>
        <button class="bottom-cart-btn" id="openCartModalBtn">
            Себетті ашу /<br>Открыть корзину
        </button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ФОТО -->
    <div class="image-modal-overlay" id="imageModal">
        <div class="image-modal-content" id="modalContainer"></div>
        <button class="close-img-modal-btn" id="closeImgModal">Жабу / Закрыть</button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО КОРЗИНЫ -->
    <div class="cart-modal-overlay" id="cartModal">
        <div class="cart-modal">
            <div class="cart-header">
                <h3>Себет / Ваша корзина</h3>
                <button class="close-cart-btn" id="closeCartBtn">Жабу / Закрыть</button>
            </div>
            <div class="cart-items-list" id="cartItemsList"></div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Барлығы / Итого:</span>
                    <span id="cartTotalPrice">0 тг</span>
                </div>
                <button class="whatsapp-checkout-btn" id="whatsappCheckoutBtn">
                    WhatsApp арқылы тапсырыс беру<br>Оформить заказ в WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        const WHATSAPP_PHONE = "77077787661";
        const API_URL = "https://script.google.com/macros/s/AKfycbx6tBF8jO6c6hAP329WSqOXvKZ4tyCVwuPeBNN7t4CWcUZlwBxpJ8rA-KdbXRaH0X8o/exec";
        
        let cart = {};
        let catalogData = {};
        let allPackagingItems = [];
        let parsedItemsRegistry = {};
        let defaultFreePackaging = null;

        const welcomeScreen = document.getElementById("welcomeScreen");
        const catalogScreen = document.getElementById("catalogScreen");
        const categoriesSection = document.getElementById("categoriesSection");
        const goToCatalogBtn = document.getElementById("goToCatalogBtn");
        const goBackHomeBtn = document.getElementById("goBackHomeBtn");
        const bottomCartBar = document.getElementById("bottomCartBar");
        const cartCountBadge = document.getElementById("cartCountBadge");
        const bottomCartTotal = document.getElementById("bottomCartTotal");
        const openCartModalBtn = document.getElementById("openCartModalBtn");
        const scrollActionBtn = document.getElementById("scrollActionBtn");
        
        const cartModal = document.getElementById("cartModal");
        const closeCartBtn = document.getElementById("closeCartBtn");
        const cartItemsList = document.getElementById("cartItemsList");
        const cartTotalPrice = document.getElementById("cartTotalPrice");
        const whatsappCheckoutBtn = document.getElementById("whatsappCheckoutBtn");

        const imageModal = document.getElementById("imageModal");
        const modalContainer = document.getElementById("modalContainer");
        const closeImgModal = document.getElementById("closeImgModal");

        window.addEventListener("scroll", () => {
            if (catalogScreen.style.display === "block") {
                const scrollHeight = document.documentElement.scrollHeight;
                const scrollTop = window.scrollY || document.documentElement.scrollTop;
                const clientHeight = document.documentElement.clientHeight;
                
                if (scrollTop > 40) {
                    categoriesSection.classList.add("scrolled");
                } else {
                    categoriesSection.classList.remove("scrolled");
                }

                if (scrollTop > 150) {
                    scrollActionBtn.classList.add("visible");
                    if ((scrollHeight - scrollTop - clientHeight) < 250) {
                        scrollActionBtn.textContent = "↑";
                        scrollActionBtn.title = "Наверх";
                    } else {
                        scrollActionBtn.textContent = "↓";
                        scrollActionBtn.title = "К подарочным упаковкам внизу";
                    }
                } else {
                    scrollActionBtn.classList.remove("visible");
                }
            } else {
                scrollActionBtn.classList.remove("visible");
                categoriesSection.classList.remove("scrolled");
            }
        });

        scrollActionBtn.addEventListener("click", () => {
            const scrollTop = window.scrollY || document.documentElement.scrollTop;
            if (scrollTop > 300 && scrollActionBtn.textContent === "↑") {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                const bottomContainer = document.getElementById("bottomPackagingContainer");
                if (bottomContainer && bottomContainer.innerHTML.trim() !== '') {
                    bottomContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
                }
            }
        });

        function extractDriveThumb(url) {
            if (!url) return '';
            const str = String(url).trim();
            let id = '';
            if (str.includes('id=')) {
                id = str.split('id=')[1].split('&')[0];
            } else if (str.includes('/d/')) {
                id = str.split('/d/')[1].split('/')[0];
            }
            return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : str;
        }

        function openZoom(imgUrl) {
            modalContainer.innerHTML = `<img src="${imgUrl}" alt="Товар вблизи">`;
            imageModal.classList.add("open");
        }

        function closeModal() {
            imageModal.classList.remove("open");
            modalContainer.innerHTML = '';
        }

        closeImgModal.addEventListener("click", closeModal);
        imageModal.addEventListener("click", (e) => {
            if (e.target === imageModal) closeModal();
        });

        goToCatalogBtn.addEventListener("click", () => {
            welcomeScreen.style.display = "none";
            catalogScreen.style.display = "block";
            window.scrollTo(0, 0);
        });

        goBackHomeBtn.addEventListener("click", () => {
            catalogScreen.style.display = "none";
            welcomeScreen.style.display = "flex";
            window.scrollTo(0, 0);
            scrollActionBtn.classList.remove("visible");
            categoriesSection.classList.remove("scrolled");
        });

        function changeItemQty(key, delta) {
            if (!cart[key]) {
                const itemObj = parsedItemsRegistry[key];
                if (delta > 0 && itemObj && itemObj.price >= 0) {
                    cart[key] = { ...itemObj, quantity: 1 };
                    
                    if (!key.startsWith('pack_') && defaultFreePackaging) {
                        const giftKey = defaultFreePackaging.key;
                        if (!cart[giftKey]) {
                            cart[giftKey] = { ...defaultFreePackaging, quantity: 1, isAutoAdded: true };
                        }
                    }
                }
            } else {
                cart[key].quantity += delta;
                if (cart[key].quantity <= 0) {
                    delete cart[key];
                }
            }
            updateGlobalCartUI();
            const activeBtn = document.querySelector(".cat-btn.active");
            if (activeBtn) switchCategory(activeBtn.dataset.cat, false);
        }

        function updateGlobalCartUI() {
            let totalCount = 0, totalSum = 0;
            for (let key in cart) {
                totalCount += cart[key].quantity;
                totalSum += (cart[key].price || 0) * cart[key].quantity;
            }
            if (totalCount > 0) {
                bottomCartBar.style.display = "flex";
                cartCountBadge.textContent = totalCount + " шт.";
                bottomCartTotal.textContent = totalSum.toLocaleString() + " тг";
            } else {
                bottomCartBar.style.display = "none";
            }
            renderCartModalItems();
        }

        function renderCartModalItems() {
            const keys = Object.keys(cart);
            if (keys.length === 0) {
                cartItemsList.innerHTML = `<div class="empty-cart-msg">Себет бос / Корзина пуста</div>`;
                cartTotalPrice.textContent = "0 тг";
                return;
            }
            let totalSum = 0;
            cartItemsList.innerHTML = keys.map(key => {
                const item = cart[key];
                const itemSum = (item.price || 0) * item.quantity;
                totalSum += itemSum;
                const imgHtml = item.img
                    ? `<img src="${item.img}" alt="${item.name}" class="cart-item-img" onclick="openZoom('${item.img}')">`
                    : `<div class="cart-item-img" style="background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#334155;">Упак.</div>`;
                
                const isGift = item.isAutoAdded || item.isIncluded;
                const giftBadgeHtml = isGift ? `<span class="gift-badge">🎁 В комплекте</span>` : '';

                return `
                    <div class="cart-item ${isGift ? 'free-gift' : ''}">
                        ${giftBadgeHtml}
                        ${imgHtml}
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">${item.price === 0 ? 'Бесплатно (в комплекте)' : item.priceText}</div>
                            <div class="cart-item-controls">
                                <button class="qty-btn" onclick="changeItemQty('${key}', -1)">-</button>
                                <span class="cart-qty-num">${item.quantity}</span>
                                <button class="qty-btn" onclick="changeItemQty('${key}', 1)">+</button>
                                <button class="remove-item-btn" onclick="deleteCartItem('${key}')">Жою / Удалить</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
            cartTotalPrice.textContent = totalSum.toLocaleString() + " тг";
        }

        window.deleteCartItem = function(key) {
            delete cart[key];
            updateGlobalCartUI();
            const activeBtn = document.querySelector(".cat-btn.active");
            if (activeBtn) switchCategory(activeBtn.dataset.cat, false);
        };

        openCartModalBtn.addEventListener("click", () => cartModal.classList.add("open"));
        closeCartBtn.addEventListener("click", () => cartModal.classList.remove("open"));
        cartModal.addEventListener("click", (e) => {
            if (e.target === cartModal) cartModal.classList.remove("open");
        });

        whatsappCheckoutBtn.addEventListener("click", () => {
            const keys = Object.keys(cart);
            if (keys.length === 0) return;
            let text = "Здравствуйте! Хочу сделать заказ из магазина Imdiva:\n\n";
            let total = 0;
            keys.forEach((key, index) => {
                const item = cart[key];
                const sum = (item.price || 0) * item.quantity;
                total += sum;
                text += `${index + 1}. *${item.name}* — ${item.quantity} шт. (${item.price === 0 ? 'В комплекте' : item.price.toLocaleString() + ' тг'}) = ${sum.toLocaleString()} тг\n`;
            });
            text += `\n*Барлығы / Итого: ${total.toLocaleString()} тг*`;
            window.open(`https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(text)}`, "_blank");
        });

        function buildCardHtml(item) {
            parsedItemsRegistry[item.key] = item;
            const cartItem = cart[item.key];
            const qty = cartItem ? cartItem.quantity : 0;

            const imageHtml = item.img ? `
                <div class="product-image-wrap" onclick="openZoom('${item.img}')">
                    ${!item.inStock ? '<span class="sold-out-badge">Сатылымда жоқ<br>Нет в наличии</span>' : ''}
                    <img src="${item.img}" alt="${item.name}" loading="lazy">
                    <span class="zoom-hint">Үлкейту / Лупа</span>
                </div>
            ` : '';

            let actionBlock;
            if (!item.inStock) {
                actionBlock = `
                    <button class="add-to-cart-simple disabled" disabled>
                        <span class="btn-main">Сатылымда жоқ</span>
                        <span class="btn-sub">Нет в наличии</span>
                    </button>
                `;
            } else if (item.isIncluded) {
                actionBlock = `
                    <div class="add-to-cart-simple included-badge">
                        <span class="btn-main">Входит в стоимость</span>
                        <span class="btn-sub">Фирменный комплимент</span>
                    </div>
                `;
            } else if (qty > 0) {
                actionBlock = `
                    <div class="card-cart-controls">
                        <button class="card-qty-btn" onclick="changeItemQty('${item.key}', -1)">-</button>
                        <span class="card-qty-count">${qty} шт.</span>
                        <button class="card-qty-btn" onclick="changeItemQty('${item.key}', 1)">+</button>
                    </div>
                `;
            } else {
                actionBlock = `
                    <button class="add-to-cart-simple" onclick="changeItemQty('${item.key}', 1)">
                        <span class="btn-main">Таңдау / Выбрать</span>
                        <span class="btn-sub">В корзину</span>
                    </button>
                `;
            }

            return `
                <article class="product-card ${!item.inStock ? 'out-of-stock' : ''}">
                    ${imageHtml}
                    <div class="product-info">
                        <div>
                            <h3 class="product-name">${item.name}</h3>
                            <div class="product-price">${item.priceText}</div>
                        </div>
                        ${actionBlock}
                    </div>
                </article>
            `;
        }

        function renderBottomPackaging(packList) {
            const bottomContainer = document.getElementById("bottomPackagingContainer");
            if (!packList || packList.length === 0) {
                bottomContainer.innerHTML = '';
                return;
            }
            const packCards = packList.map(p => buildCardHtml(p)).join("");
            bottomContainer.innerHTML = `
                <div class="packaging-divider">
                    <h3>🎁 Пакет / Коробка • Подарочная упаковка</h3>
                    <p>Выберите красивое оформление для вашего подарка</p>
                </div>
                <div class="products-grid">${packCards}</div>
            `;
        }

        function parsePackagingFromRows(rows, scopeName) {
            const result = [];
            const seenKeys = new Set();

            rows.forEach((row, idx) => {
                const packPhotoRaw = String(row['G'] ?? row['упаковка'] ?? row['Упаковка'] ?? '').trim();
                const packPriceRaw = String(row['H'] ?? row['стоимасть упаковки'] ?? row['стоимость упаковки'] ?? row['Стоимость упаковки'] ?? '').trim();
                const packCode = String(row['I'] ?? row['код упаковки'] ?? row['Код упаковки'] ?? '').trim();

                if (packPhotoRaw || packPriceRaw || packCode) {
                    const packImg = packPhotoRaw.includes('http') ? extractDriveThumb(packPhotoRaw) : '';
                    const rawTitle = packCode || (!packPhotoRaw.includes('http') ? packPhotoRaw : 'Упаковка');
                    
                    let packTitle = rawTitle;
                    const lower = rawTitle.toLowerCase();
                    if (!lower.includes('пакет') && !lower.includes('коробка')) {
                        packTitle = `Пакет/Коробка: ${rawTitle}`;
                    }

                    const numPackPrice = Number(packPriceRaw.replace(/[^\d]/g, '')) || 0;
                    const isIncluded = packPriceRaw.toLowerCase().includes('входит');
                    const uniqueId = `pack_${packTitle}_${packPriceRaw}`;

                    if (!seenKeys.has(uniqueId)) {
                        seenKeys.add(uniqueId);
                        const packObj = {
                            key: `pack_${scopeName}_${idx}_${packTitle}`,
                            name: packTitle,
                            price: isIncluded ? 0 : numPackPrice,
                            priceText: packPriceRaw || (numPackPrice > 0 ? numPackPrice.toLocaleString() + ' тг' : 'Бесплатно'),
                            img: packImg,
                            inStock: true,
                            isIncluded: isIncluded
                        };
                        result.push(packObj);
                        
                        if (isIncluded && !defaultFreePackaging) {
                            defaultFreePackaging = packObj;
                        }
                    }
                }
            });
            return result;
        }

        function switchCategory(catKey, scrollToSection = true) {
            const headingEl = document.getElementById("sectionHeading");
            const contentEl = document.getElementById("catalogContent");

            if (catKey === "general") {
                headingEl.innerHTML = `
                    <h2>Жалпы ақпарат / Общая информация</h2>
                    <p>Imdiva — сшито с любовью • Алматы</p>
                `;
                contentEl.innerHTML = `
                    <div class="brand-story-card">
                        <h3>Imdiva — сшито с любовью</h3>
                        <p>Авторские аксессуары и платки в современном национальном стиле. Изысканная ручная работа и премиальное качество для ценителей элегантности.</p>
                        <div class="info-highlights">
                            <div class="highlight-item">
                                <strong>Алматы • Доставка</strong>
                                <span>Оперативная доставка по всему Казахстану</span>
                            </div>
                            <div class="highlight-item">
                                <strong>100% Ручная работа</strong>
                                <span>Эксклюзивные детали и благородные ткани</span>
                            </div>
                        </div>
                        <div class="quick-actions">
                            <a href="https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent('Здравствуйте! Хочу проконсультироваться по ассортименту.')}" target="_blank" class="white-action-btn">
                                💬 Написать консультанту в WhatsApp
                            </a>
                            <a href="https://www.instagram.com/d_iva_brand" target="_blank" class="white-action-btn">
                                ✨ Посмотреть новинки в Instagram
                            </a>
                        </div>
                    </div>
                `;
                renderBottomPackaging([]);
            } else {
                headingEl.innerHTML = `
                    <h2>${catKey}</h2>
                    <p>Imdiva — Алматы</p>
                `;
                const rawItems = catalogData[catKey] || [];
                const items = [];

                rawItems.forEach((row, idx) => {
                    const photoRaw = String(row['A'] ?? row['фото'] ?? row['Фото'] ?? '').trim();
                    if (!photoRaw) return;

                    const img = extractDriveThumb(photoRaw);
                    const rawPriceStr = String(row['B'] ?? row['стоимость'] ?? row['Стоимость'] ?? row['стоимость товара'] ?? '').trim();
                    const price = Number(rawPriceStr.replace(/[^\d]/g, '')) || 0;
                    const priceText = rawPriceStr || (price > 0 ? price.toLocaleString() + ' тг' : '');
                    const name = String(row['C'] ?? row['название'] ?? row['Название'] ?? 'Товар').trim();

                    const colE = String(row['E'] ?? row['нет в наличии'] ?? '').trim();
                    const inStock = colE ? false : true;

                    items.push({
                        key: `prod_${catKey}_${idx}_${name}`,
                        name,
                        price,
                        priceText,
                        img,
                        inStock,
                        isIncluded: false
                    });
                });

                if (items.length === 0) {
                    contentEl.innerHTML = `
                        <div class="empty-category">
                            <h3>Топтама дайындалуда / Раздел наполняется</h3>
                            <p style="margin-top:8px;">Скоро здесь появятся новинки. Для заказа вы можете написать нам в WhatsApp.</p>
                        </div>
                    `;
                } else {
                    const cardsHtml = items.map(item => buildCardHtml(item)).join("");
                    contentEl.innerHTML = `<section class="products-grid">${cardsHtml}</section>`;
                }

                const categoryPacks = parsePackagingFromRows(rawItems, catKey);
                renderBottomPackaging(categoryPacks.length > 0 ? categoryPacks : allPackagingItems);
            }

            if (scrollToSection) {
                headingEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        async function loadCatalog() {
            try {
                const response = await fetch(API_URL);
                const rawArray = await response.json();
                
                if (Array.isArray(rawArray)) {
                    catalogData = {};
                    
                    rawArray.forEach(item => {
                        const cat = String(item['category'] ?? item['категория'] ?? item['Категория'] ?? 'Другое').trim();
                        if (!catalogData[cat]) {
                            catalogData[cat] = [];
                        }
                        catalogData[cat].push(item);
                    });

                    allPackagingItems = parsePackagingFromRows(rawArray, 'global');

                    const tabsContainer = document.getElementById("categoryTabs");
                    
                    tabsContainer.innerHTML = `
                        <button class="cat-btn active" data-cat="general">
                            <span class="cat-main">Жалпы ақпарат</span>
                            <span class="cat-sub">Общая информация</span>
                        </button>
                    `;

                    for (let catKey in catalogData) {
                        const btn = document.createElement("button");
                        btn.className = "cat-btn";
                        btn.dataset.cat = catKey;
                        btn.innerHTML = `
                            <span class="cat-main">${catKey}</span>
                            <span class="cat-sub">Коллекция</span>
                        `;
                        tabsContainer.appendChild(btn);
                    }

                    document.querySelectorAll(".cat-btn").forEach(btn => {
                        btn.addEventListener("click", () => {
                            document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
                            btn.classList.add("active");
                            switchCategory(btn.dataset.cat, true);
                        });
                    });
                }
            } catch (error) {
                console.error("Ошибка загрузки каталога:", error);
                document.getElementById("catalogContent").innerHTML = `
                    <div class="empty-category">
                        <h3>Деректерді жүктеу сәтсіз аяқталды / Ошибка загрузки</h3>
                    </div>
                `;
            }
        }

        loadCatalog();
        switchCategory("general", false);
    </script>
</body>
</html>
